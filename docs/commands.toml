# ------------------------------------------------------------------------------
# new             
# ------------------------------------------------------------------------------
[new]
name = "new"
summary = "create a new project"
synopsis = "orbit new [options] <path>"
description = """
Creates a new project at the target directory `<path>`. The path is assumed to 
not already exist. A new directory will be created at the file system 
destination that contains a minimal manifest file.

If no name is supplied, then the project's name defaults to the final directory 
name taken from `<path>`. Using the `--name` option allows this field to be
explicitly set.

The newly created manifest file is intended to be edited by the user. See more
`Orbit.toml` keys and their definitions at:

   https://chaseruskin.github.io/orbit/reference/manifest.html

For initializing an already existing directory into a project, see the `init` 
command.
"""

args."<path>" = "Directory to create for the project"

options."--name <name>" = "Set the resulting project's name"
options."--lib <lib>" = "Set the resulting project's library"

examples = """
orbit new gates
orbit new eecs/lab1 --name adder
"""

# ------------------------------------------------------------------------------
# init      
# ------------------------------------------------------------------------------
[init]
name = "init"
summary = "initialize a project from an existing directory"
synopsis = "orbit init [options] [<path>]"
description = """
Initializes a project at the file system directory `<path>`. If no path is
provided, then it defaults to the current working directory. 

If no name is provided, then the resulting project's name defaults to the 
directory's name. Using the `--name` option allows the project's name to be 
explicitly set.

Under certain circumstances, you may need a new uuid. This situation will be
uncommon for many users, but nonetheless it exists. To display a new uuid that
can be copied into an existing manifest, use the `--uuid` option. All other
options are ignored when this option is present. Keep in mind that a project's 
uuid is not intended to change over the course of its lifetime.

The newly created manifest file is intended to be edited by the user. See more
`Orbit.toml` keys and their definitions at:

   https://chaseruskin.github.io/orbit/reference/manifest.html

To create a new project from a non-existing directory, see the `new` command.
"""

options."<path>" = "Directory to initialize"
options."--name <name>" = "Set the resulting project's name"
options."--lib <lib>" = "Set the resulting project's library"
options."--uuid" = "Print a new uuid and exit"

examples = """
orbit init
orbit init projects/gates
orbit init --name adder
orbit init --uuid
"""

# ------------------------------------------------------------------------------   
# info           
# ------------------------------------------------------------------------------
[info]
name = "info"
summary = "display information about a project"
synopsis = "orbit info [options] [<project>]"
description = """
Displays various bits of information about a particular project. If no project 
is provided, then it displays information related to the local project.

To display manifest information, no additional options are required.

To display the available units within the project, use the `--units` option. 
For non-local projects, its protected and private design units are hidden
from the results. To include design units of all visibility levels, use the 
`--force` flag.

To display the known versions for a project, use the `--versions` option.
"""

options."<project>" = "Project ID specification"
options."--versions, -v" = "Display the list of known versions"
options."--units, -u" = "Display the units for this project"

examples = """
orbit info --units
orbit info gates:1.0.0 --units --force
orbit info gates --versions
orbit info gates:1 --versions
"""

# ------------------------------------------------------------------------------
# read          
# ------------------------------------------------------------------------------
[read]
name = "read"
summary = "lookup hdl source code"
synopsis = "orbit read [options] <unit>"
description = """
Navigates hdl source code to lookup requested hdl code snippets. Looking up
hdl source code to see its implementation can help gain a better understanding
of the code being reused in your current design.

By default, the resulting code is displayed to the console. To write the
results to a file for improved readability, use the `--save` option. Combining 
the `--locate` option with the `--save` option will append the line and column
number of the identified code snippet to the end of the resulting file path.

If no project is provided by the `--project` option, then it will assume to 
search the local project for the provided design unit.

The values for options `--start`, `--end`, and `--doc` must be valid hdl code. 
The code is interpreted in the native language of the provided design unit.

The `--doc` option will attempt to find the comments immediately preceding the
identified code snippet. 

A design unit must visible in order for it to return the respective source
code. When reading a design unit that exists within the local project, it can 
be any visibility. When reading a design unit that exists outside of the
local project, its visibility must be "public" or "protected". Design units 
that are set to "private" visibility are not allowed to be read outside of
their project.

Every time this command is called, it attempts to clean the temporary
directory where it saves resulting files. To keep existing files on the next
call of this command, use the `--keep` option.
"""

args."<unit>" = "Read the file for this primary design unit"

options."--project, -p <spec>" = "Project ID specification"
options."--doc <code>" = "Find the preceding comments to the code snippet"
options."--save" = "Write the results to a temporary read-only file"
options."--start <code>" = "Start the lookup after jumping to this code snippet"
options."--end <code>" = "Stop the lookup after finding this code snippet"
options."--limit <n>" = "Maximum number of source code lines to return"
options."--keep, -k" = "Do not clean the temporary directory of existing files"
options."--locate" = "Append the line and column number to the resulting file"

examples = """
orbit read and_gate --limit 25
orbit read math_pkg -p math --doc "function clog2" --start "package math_pkg"
orbit read math_pkg -p math --doc "function flog2p1" --save --locate
"""

# ------------------------------------------------------------------------------ 
# get
# ------------------------------------------------------------------------------
[get]
name = "get"
summary = "display integration code for a unit"
synopsis = "orbit get [options] [<unit>]"
description = """
Returns hdl code snippets for the provided design unit to be integrated into 
the current project. The code snippets are returned in the native hdl
language of the identified design unit. Code snippets are designed to be
copy and pasted from the console to the current design for quick code 
integration.

If a project is not provided with the `--project` option, then it will search 
the local project for the requested design unit.

If the design unit is in VHDL with the `--instance` option being used without
the `--component` option, then it will return the direct instantiation code
style (VHDL-93 feature).

Copying unit instantiations into higher-level entities will not 
automatically track source code references across projects. In order to 
properly establish source code reference tracking across projects, the local 
project's manifest must have an up to date `[dependencies]` table that lists 
all the external projects from which it references source code.

An identifier prefix or suffix can be attached to the signal declarations and
the instantiation's port connection signals by using `--signal-prefix` and 
`--signal-suffix` respectively. These optional texts are treated as normal
strings and are not checked for correct hdl coding syntax.

When no output options are specified, this command by default will display
the unit's declaration.

A design unit must visible in order for it to return the respective code
snippets. When fetching a design unit that exists within the local project, it
can be any visibility. When fetching a design unit that exists outside of the
local project, its visibility must be "public". Design units that are set to 
"protected" or "private" visibility are not allowed to be referenced across
projects.

Exporting the unit's declaration information can be accomplished by using the
`--json` option. The valid json is unformatted for encouragement to be 
processed by other programs. Retrieve a list of all the unit declarations
for the project by omitting `<unit>` while still using the `--json` option.

By default, the code snippets will be displayed in the design unit's native
hardware description language. To return the code snippets in a particular
language, use the `--language` option. Valid values are "vhdl", "sv", or 
"native".
"""

args."<unit>" = "Primary design unit identifier"

options."--project, -p <spec>" = "Project ID specification"
options."--json" = "Export the unit's information as valid json"
options."--library, -l" = "Display the unit's library declaration"
options."--component, -c" = "Display the unit's declaration"
options."--signals, -s" = "Display the constant and signal declarations"
options."--instance, -i" = "Display the unit's instantiation"
options."--language <hdl>" = "Display in the specified language (vhdl, sv, native)"
options."--architecture, -a" = "Display the unit's architectures"
options."--name <identifier>" = "Set the instance's identifier"
options."--signal-prefix <str>" = "Prepend information to the instance's signals"
options."--signal-suffix <str>" = "Append information to the instance's signals"

examples = """
orbit get and_gate --project gates:1.0.0 --component
orbit get ram --project mem:2 -csi
orbit get uart -si --name uart_inst0
orbit get or_gate -p gates --json
orbit get --json
"""

# ------------------------------------------------------------------------------     
# tree    
# ------------------------------------------------------------------------------
[tree]
name = "tree"
summary = "show a dependency graph"
synopsis = "orbit tree [options] [<unit>...]"
description = """
Shows the hierarchical tree structure of the hardware design starting from a
root node.

By default, it will try to automatically detect the root node for the 
local project. If there is ambiguity in determining what node can be the root, 
then all root nodes and their respective trees will be displayed. To only 
display the tree of a particular node, use the `<unit>` option.

The tree can display different kinds of dependencies relative to the current
project using the `--edges` option. By default, this command uses "unit". By
specifying edges as "project", it will return the project-level dependency 
tree. When using "unit" or "all", the HDL dependency graph will be displayed.

The HDL graph shown with "unit" displays the composition of usable 
entities/modules. To generate this graph, it analyzes each VHDL architecture 
and ignores Verilog compiler directives. If an unidentified entity is 
instantiated, it will appear as a leaf in the graph and will be considered 
as a "black box" denoted by the "?" character next to its position in the 
tree. The HDL graph shown with "all" displays the composition of the design 
including all primary design unit references. Any references (excluding entity 
instantiations) that are not found will not appear in the dependency graph for
the "all" option.

Nodes marked with (*) have been "de-duplicated". The dependencies for the node 
have already been shown elsewhere in the graph, and so are not repeated. Use 
the `--no-dedupe` option to repeat the duplicates.

Using the `--format` option can alter how much information is displayed for
each HDL design unit in the tree composition. By default, only the design
unit's name is displayed for each unit.

If the tree's character output is not displaying properly, then the tree can
be displayed using a set of standard ASCII characters with the `--charset`
option set to "ascii".
"""

options."<unit>..." = "Uppermost HDL unit of the dependency tree"
options."--edges, -e <kind>" = "The kind of dependencies to display (unit, project, all)"
options."--invert, -i" = "Show the reverse dependencies for the node"
options."--depth <depth>" = "Maximum display depth of the dependency tree"
options."--format <format>" = "Determine how to display node names (short, long)"
options."--no-dedupe" = "Do not de-duplicate repeated dependencies"
options."--charset <charset>" = "Choose the character set for the tree (utf8, ascii)"
options."--json" = "Export the tree's information as valid json"

examples = """
orbit tree
orbit tree top --format long
orbit tree -e project --charset ascii
"""

# ------------------------------------------------------------------------------  
# lock     
# ------------------------------------------------------------------------------
[lock]
name = "lock"
summary = "save the world state of a project"
synopsis = "orbit lock [options]"
description = """
Saves the state of the world for the local project. To accomplish this, Orbit 
reads the local project's manifest file, "Orbit.toml", to resolve any missing
project dependencies. It writes the information required to reproduce this 
state to the project's lock file, "Orbit.lock".

A local project must exist for this command to execute.

It is encouraged to check the lock file into version control such that other
users trying to reconstruct the project can reproduce the project's current 
state. The lock file should not be manually edited by the user.

To capture the world state for the local project, Orbit downloads and installs 
any unresolved project dependencies. If an installed dependency's computed 
checksum does not match the checksum stored in the lock file, it assumes the 
installation is corrupt and will reinstall the dependency to the cache.
"""

options."--force" = "Ignore reading the precomputed lock file"

examples = """
orbit lock
orbit lock --force
"""

# ------------------------------------------------------------------------------     
# analyze    
# ------------------------------------------------------------------------------
[analyze]
name = "analyze"
summary = "print a blueprint"
synopsis = "orbit analyze [options]"
description = """
Prints the blueprint to stdout.

This command performs the planning stage of the build process and displays
the resulting blueprint contents to stdout. Entries in the blueprint are
guaranteed to be in a deterministic order.

If the `--plan` option is omitted, then the default plan is used (tsv).

If `--local` is used, then only the entries for source files belonging to
the current project are included in the final blueprint. If the blueprint
includes dependency information from a different project, the dependency 
information is still included for that entry.

If `--force` is used, then a blueprint will be displayed (albeit possibly
incomplete) regardless if there are HDL parsing or analysis errors.
"""

options."--local" = "Filter entries that belong to the working project"
options."--force" = "Force the blueprint to be displayed"
options."--plan <format>" = "Set the blueprint file format"

examples = """
orbit analyze --plan json --local
"""


# ------------------------------------------------------------------------------
# test      
# ------------------------------------------------------------------------------
[test]
name = "test"
alias = "t"
summary = "run a test"
synopsis = "orbit test [options] [--] [args]..."
description = """
This command prepares a given target and then executes the target under the
context of a test.

While this command functions similar to `orbit build`, the targets that are 
encouraged to be used with this command are ones that are designed to either
"pass" or "fail", typically through a return code. This command optionally
requests a testbench, if you must not allow a testbench, see `orbit build`.

A target must be provided for the test command to run. A default target can
be specified in a configuration file, which will be used when a target is
omitted from the command-line.

When the `--dut` option and the `--tb` option are omitted, all possible 
DUTs and TBs are included, leaving the respective DUT and TB environment 
variables empty. Filesets using valid string swapping variables such as 
`orbit.dut.name` will resolve to the wildcard character (`*`).

If `--list` is used, then it will display a list of the available targets to
the user. Using `--list` in combination with a target from `--target` will
display any detailed help information the target has documented in its 
definition.

A target typically goes through three steps for the testing process:  
   1. Parse the blueprint file  
   2. Process the referenced files listed in the blueprint  
   3. Verify the HDL source code passes all tests

Any command-line arguments entered after the terminating flag `--` will be
passed in the received order as arguments to the subprocess's command. If a 
target already has defined arguments, the additional arguments passed from the 
command-line will follow the previously defined arguments.

The target's process will spawn from the current project's output directory, 
which is $ORBIT_OUT_DIR.

While the execution stage is a subprocess within Orbit, any non-zero error code 
returned from the user-defined execution process is propagated through Orbit.
"""

options."--target, -t <name>" = "Target to execute"
options."--dut <unit>" = "Set the device under test"
options."--tb <unit>" = "Set the top level testbench unit"
options."--plan <format>" = "Set the blueprint file format"
options."--target-dir <dir>" = "The relative directory where the target starts"
options."--command <path>" = "Overwrite the target's command"
options."--list, -l" = "View available targets and exit"
options."--fileset <key=glob>..." = "A glob-style pattern identified by name to include in the blueprint"
options."--force" = "Force the target to execute"
options."--verbose" = "Display the command being executed"
options."args" = "Arguments to pass to the target"

examples = """
orbit test --dut adder --tb adder_tb --target modelsim -- -r sim
"""

# ------------------------------------------------------------------------------
# build, b       
# ------------------------------------------------------------------------------
[build]
name = "build"
alias = "b"
summary = "plan and execute a target"
synopsis = "orbit build [options] [--] [args]..."
description = """
This command prepares a given target and then executes the target under the
context of a build.

While this command functions similar to `orbit test`, the targets that are 
encouraged to be used with this command are ones that produce artifacts at the
end of their execution process. This command does not allow the top to be a
testbench, if you want to set a testbench, see `orbit test`.

A target must be provided for the build command to run. A default target can
be specified in a configuration file, which will be used when a target is
omitted from the command-line.

When the `--top` option is omitted, all possible top-level units will be
included, leaving the respective top environment variables empty. Filesets 
using valid string swapping variables such as `orbit.top.name` will resolve 
to the wildcard character (`*`).

If `--list` is used, then it will display a list of the available targets to
the user. Using `--list` in combination with a target from `--target` will
display any detailed help information the target has documented in its 
definition.

A target typically goes through three steps for the building process:  
   1. Parse the blueprint file  
   2. Process the referenced files listed in the blueprint  
   3. Generate one or more artifacts

Any command-line arguments entered after the terminating flag `--` will be
passed in the received order as arguments to the subprocess's command. If a 
target already has defined arguments, the additional arguments passed from the 
command-line will follow the previously defined arguments.

The target's process will spawn from the current project's output directory,
which is $ORBIT_OUT_DIR.

While the execution stage is a subprocess within Orbit, any non-zero error code 
returned from the user-defined execution process is propagated through Orbit.
"""

options."--target, -t <name>" = "Target to execute"
options."--top <unit>" = "Set the top level design unit"
options."--plan <format>" = "Set the blueprint file format"
options."--target-dir <dir>" = "The relative directory where the target starts"
options."--command <path>" = "Overwrite the target's command"
options."--list, -l" = "View available targets and exit"
options."--fileset <key=glob>..." = "A glob-style pattern identified by name to include in the blueprint"
options."--force" = "Force the target to execute"
options."--verbose" = "Display the command being executed"
options."args" = "Arguments to pass to the target"

examples = """
orbit build
orbit build --target quartus --top riscv_cpu
orbit build -- --some-arg1 --some-arg2
"""

# ------------------------------------------------------------------------------
# clean             
# ------------------------------------------------------------------------------
[clean]
name = "clean"
summary = "remove the target directory"
synopsis = "orbit clean [options]"
description = """
Remove artifacts that Orbit has generated in the past.

By default, this command deletes all directories found within the current
project's target directory. To select a single target's directory for removal,
use the `--target` option.
"""

options."--doc" = "Whether or not to clean just the documentation directory"
options."--target, -t <name>" = "Target output directory to just remove"
options."--target-dir <dir>" = "The relative directory where the targets exist"

examples = """
orbit clean
orbit clean --target modelsim
"""

# ------------------------------------------------------------------------------
# doc          
# ------------------------------------------------------------------------------
[doc]
name = "doc"
summary = "generate a project's documentation"
synopsis = "orbit doc [options]"
description = """
Generates documentation for a project and all of its dependencies based on 
inline markdown comments.

Documentation is extracted from comments embedded in the source code. A
comment on the immediate line above a documentable item will be treated as 
that item's documentation, unless a comment is found on the exact line of the
documentable item. Multiple lines of comments can represent a documentable
item as long as there are no lines between the comments that is not a comment.
Comments used for document generation are interpreted as Markdown.

The BROWSER environment variable is required to be set when using the `--open`
flag.
"""

options."--open" = "Open the docs in a browser after the operation"
options."--no-deps" = "Don't build documentation for dependencies"
options."--document-private-units" = "Document private units"
options."--target-dir <dir>" = "Directory for all generated artifacts and intermediate files"

examples = """
orbit doc
orbit doc --no-deps
"""

# ------------------------------------------------------------------------------
# publish          
# ------------------------------------------------------------------------------
[publish]
name = "publish"
summary = "post a project to a channel"
synopsis = "orbit publish [options]"
description = """
Performs a series of checks for a local project and then releases it to its 
specified channel(s).

There are multiple checks that are performed before a project can be published. 
First, the project must have an up to date lockfile with no relative 
dependencies. The project's manifest must also have a value for the source 
field. In addition, Orbit must be able to construct the HDL source code graph 
without errors. Finally, the project is downloaded from its source url and 
temporarily installed to verify its contents match those of the local project.

Posting a project to a channel involves copying the project's manifest file to 
a path within the channel known as the index. For every publish of a project, 
the index corresponds to a unique path within the channel that gets created by 
Orbit. A channel's pre-publish and post-publish hooks can get the value for the
project's index by reading the ORBIT_CHANNEL_PROJECT_DIR environment variable.

The `--all-public` flag can be used to skip providing the "project.public" 
field in the current project's manifest, granting the assumption that all 
source files should be public. It cannot be used if the "project.public" field 
exists.

If at least one channel is specified on the command-line using the `--channel`
option, then any channel list found in the project's manifest under the 
"project.channels" field will be ignored as well as any channel list found in the
"publish.default-channels" field of a configuration file.

By default, this command performs a dry run, which executes all of the steps 
in the process except for actually posting the project to its channel(s). 
To run the command to completion, use the `--ready` option.

If the publishing process fails during the channel's pre or post commands,
Orbit will rollback its changes by removing any files it copied into the
channel as well as any newly created directories it made.
"""

options."--ready, -y" = "Run the operation to completion"
options."--channel, -c <name>..." = "Use this channel during publishing"
options."--no-install" = "Do not install the project for future use"
options."--list, -l" = "View available channels and exit"
options."--all-public" = "Publish with all source files being public"

examples = """
orbit publish
orbit publish --ready
orbit publish -c hyperspace-labs -y
"""

# ------------------------------------------------------------------------------
# search          
# ------------------------------------------------------------------------------
[search]
name = "search"
summary = "browse the catalog"
synopsis = "orbit search [options] [<project>]"
description = """
Returns a list of the projects found in the catalog.

The returned list of projects is organized by row with each row consisting of four
columns: the project's name, latest version, catalog state, and UUID.

By default, all projects in the catalog will be returned. To filter by project
name, use the `<project>` option. To limit the number of results, use the 
`--limit` option.

A project can be stored across three different levels: installed in the cache,
downloaded to the archive, and available via channels. By default, all levels
are searched for projects. Applying a level filter (`--install`, `--download`, 
`--available` options) will restrict the search to only checking the filtered
levels for projects.

A resulting project is only read from one level, even when multiple levels are
searched. When a project exists at multiple levels, the catalog imposes a 
priority on which level to choose. Installed projects have higher priority 
over downloaded projects, and downloaded projects have higher priority over 
available projects.

Results can also be filtered by keyword using the `--keyword` option. By
default, if a project matches at least one filter then it will be returned in 
the result. To collect only projects that match each presented filter, use 
the `--match` option.

If a project has a higher version that exists and is not currently installed, 
then an asterisk character "*" will appear next the project's version. To 
update the project to the latest version, see the `install` command.
"""

options."<project>" = "Project ID specification"
options."--install, -i" = "Filter projects installed to the cache"
options."--download, -d" = "Filter projects downloaded to the archive"
options."--available, -a" = "Filter projects available via channels"
options."--keyword <term>..." = "Include projects that have this keyword"
options."--limit <n>" = "Maximum number of results to return"
options."--match" = "Return results that pass each filter"

examples = """
orbit search axi
orbit search --keyword memory --keyword ecc
orbit search --keyword cdc --limit 20 -i
"""

# ------------------------------------------------------------------------------
# install         
# ------------------------------------------------------------------------------
[install]
name = "install"
summary = "store an immutable reference to a project"
synopsis = "orbit install [options]"
description = """
This command will place a project into the cache. By default, the specified 
version is the 'latest' released version of the project that Orbit has 
identified.

When this command is ran without specifying the `<project>` or a source (such 
as `--url` or `--path`), it will attempt to install the current project, if it
exists.

By default, any dependencies required only for development by the target
project are omitted from installation. To also install these dependencies, 
use the `--all-deps` flag.

If a protocol is recognized using `--protocol`, then an optional tag can also 
be supplied to help the protocol with providing any additional information it
may require.

The `--path` option can accept a file system path that is either 1) the root 
directory that contains the manifest file or 2) a zip archive file that when 
uncompressed, has the manifest file at the root directoy.

The `--all-public` flag can be used to skip providing the "project.public" 
field in the current project's manifest, granting the assumption that all 
source files should be public. It can only be present when installing from a 
local project and when the "project.public" field does not exist.

To remove a project from the catalog, see the `remove` command.
"""

options."<project>" = "Project ID specification"
options."--url <url>" = "URL to install the project from the internet"
options."--path <path>" = "Path to install the project from local file system"
options."--protocol, -p <name>" = "Protocol to download the project"
options."--force" = "Install the project regardless of the cache slot occupancy"
options."--offline" = "Skip checking coherency with source"
options."--list, -l" = "View available protocols and exit"
options."--all-deps" = "Install all dependencies (including development)"
options."--all-public" = "Install with all source files being public"

examples = """
orbit install
orbit install lcd_driver:2.0
orbit install adder:1.0.0 --url https://my.adder/project.zip
orbit install alu:2.3.7 --path ./projects/alu --force 
"""

# ------------------------------------------------------------------------------
# remove      
# ------------------------------------------------------------------------------
[remove]
name = "remove"
summary = "delete a project from the catalog"
synopsis = "orbit remove [options] <project>"
description = """
Deletes save data for a known project from the catalog. The project's data for 
its particular version is removed from the catalog's cache and the catalog's
archive.

By default, an interactive prompt will appear to confirm with the user if the 
correct project is okay to be removed. To skip this interactive prompt and assume
it is correct without confirmation, use the `--force` option.

To add a project to the catalog, see the `install` command.
"""

args."<project>" = "Project ID specification"

# options."--recurse, -r" = "Also remove the project's dependencies"
options."--force" = "Skip interactive prompts"
options."--verbose" = "Display where the removal occurs"

examples = """
orbit remove gates
orbit remove gates:1.0.1 --force
"""

# ------------------------------------------------------------------------------
# env             
# ------------------------------------------------------------------------------
[env]
name = "env"
summary = "print orbit environment information"
synopsis = "orbit env [options]"
description = """
Displays environment variables as key-value pairs related to Orbit.

By default, this command prints information as a shell script. If one or more
variable names are given as arguments using `<key>`, then it will print the 
value of each provided variable on its own line.

Environment information can change based on where the command is executed.

Environment variables that are known only at runtime are not displayed. Be
sure to review the documentation for a list of all environment variables set 
by Orbit.
"""

options."<key>..." = "Display this variable's value"

examples = """
orbit env
orbit env ORBIT_HOME
orbit env ORBIT_MANIFEST_DIR ORBIT_PROJECT_NAME
"""

# ------------------------------------------------------------------------------
# config          
# ------------------------------------------------------------------------------
[config]
name = "config"
summary = "modify configuration data"
synopsis = "orbit config [options] [<path>]"
description = """
Provides an entry point to the current configuration data through the
command-line.

To list the configuration files that are currently being used, use the
`--list` option. The configuration files are sorted in order from highest
precedence to lowest precedence. This means values that are set in files
higher in the list overwrite values that may have existed from files lowering
in the list.

Providing the path of a configuration file using the `<path>` option will
limit the accessible data to only the data found in the file. If no path is 
specified, then it will display the aggregated result of the current
configuration data from across all files in use.

If there are no options set to modify data, then the resulting configuration
data will be displayed.

Modifying fields of the configuration data by default will edit the user's
global configuration, found at "$ORBIT_HOME/config.toml".

To modify a field, the full key must be provided. Fields located inside
tables require decimal characters "." to delimit between the key names. Each 
modified field is edited in the configuration file has the lowest precedence
and would allow the changes to take effect. Files that won't be edited are
configuration files that are included in the global config file. If the
field does not exist in any configuration level, then the field will be
modified at in the global config file.

When modifying data, additions are processed before deletions. This means all
`--push` options occur before `--pop` options, and all `--set` options occur 
before `--unset` options. Not every configuration field can be edited through 
the command-line. More complex fields may require manual edits by opening its
respective file.

If the item to be pushed to a key's list using `--push` already exists in the 
list, it will not be added again.
"""

options."<path>" = "The destination to read/write configuration data"

options."--push <key=value>..." = "Add a new value to a key's list"
options."--pop <key>..." = "Remove the last value from a key's list"
options."--set <key=value>..." = "Store the value as the key's entry"
options."--unset <key>..." = "Delete the key's entry"
options."--list, -l" = "Print the list of configuration files and exit"

examples = """
orbit config --push include="profiles/hyperspacelab"
orbit config ~/.orbit/config.toml --unset env.vivado_path
"""


