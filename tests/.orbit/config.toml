[[target]]
name = "foo"
description = "Print bar to the console"
command = ["cat", "{{ orbit.blueprint }}"]
plans = ["tsv", "json"]


[[target]]
name = "ao"
description = "Print the blueprint contents"
command = ["cat", "blueprint.tsv"]

[[target]]
name = "rr"
description = "Test of recursive filesets"
command = ["cat", "blueprint.tsv"]
fileset.pyf = { patterns = ["*.py"], recursive = true }

[[target]]
name = "ll"
description = "Test of custom filesets"
command = ["cat", "blueprint.tsv"]
fileset.atxt = { patterns = ["*.txt"], recursive = false }
fileset.stxt = "/here/*.txt"
fileset.ptxt = "here/*.txt"

[test]
target = "ao"