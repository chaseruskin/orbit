[[target]]
name = "foo"
description = "Print the blueprint contents"
command = "cat"
args = ["{{orbit.blueprint}}"]

[test]
default-target = "foo"

[build]
default-target = "foo"

[vhdl-format]
highlight-syntax = true

[verilog-format]
highlight-syntax = true


[[target]]
name = "multi"
command = "cat"
build = true
test = false
args = ["{{ orbit.blueprint }}"]
fileset.TEXT = { patterns = ["a.txt", "b.txt"] }

[[protocol]]
name = "gitit"
description = "Simple git protocol"
patterns = ["*.git"]
command = "git"
args = ["clone", "{{ orbit.ip.repository }}"]

