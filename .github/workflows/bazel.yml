name: Bazel
on:
  workflow_call:

env:
  # Pinned for CI determinism; bump alongside any required new lints.
  BUILDIFIER_VERSION: 8.5.1

jobs:
  bazel:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-bazel
          repository-cache: true

      - name: Install buildifier
        run: |
          curl -fsSL -o "$RUNNER_TEMP/buildifier" \
            "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64"
          chmod +x "$RUNNER_TEMP/buildifier"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/buildifier" --version

      # Build everything in the root module — the orbit_cli Rust binary,
      # the Go gazelle plugin, and the bundled gazelle_orbit executable.
      - name: Build root workspace
        run: bazel build //...

      # Run gazelle on the example. Then `git diff --exit-code` validates
      # that the generated BUILD files match what's committed, catching
      # any drift between the plugin and the example.
      - name: Run gazelle on the example workspace
        working-directory: examples/bazel
        run: bazel run //:gazelle

      - name: Verify gazelle output matches committed BUILDs
        working-directory: examples/bazel
        run: git diff --exit-code -- '**/BUILD.bazel' '**/Orbit.lock'

      # Validate every BUILD/.bzl/MODULE/WORKSPACE file in the repo is
      # buildifier-clean (formatting + the full set of lint warnings).
      # The gazelle plugin writes through buildifier's AST, so its output
      # is expected to pass with zero diffs and zero warnings; this check
      # guards against regressions in that contract.
      #
      # Buildifier's `-r .` automatically skips bazel-* convenience
      # symlinks and hidden directories. The vendored crates under
      # 3rdparty/crates/ and the rules_systemrdl toolchain plumbing under
      # examples/bazel/tools/ are auto-generated by their respective
      # ecosystems and aren't ours to keep buildifier-clean — buildifier
      # has no flag-level skiplist, so anything that ever lands a warning
      # in those trees needs to be handled at the source.
      - name: Lint with buildifier
        run: buildifier -lint=warn -mode=check -warnings=all -r .

      # Build the gazelle-generated targets end-to-end. This exercises
      # rules_vhdl, rules_verilog, and rules_systemrdl (via the toolchain
      # set up in //tools/toolchains).
      - name: Build example targets
        working-directory: examples/bazel
        run: bazel build //...
