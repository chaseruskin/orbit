[package]
name = "orbit"
version = "0.29.3"
description = "Package manager and build system for VHDL, Verilog, and SystemVerilog"
authors = ["Chase Ruskin <cruskin@umich.edu>"]
keywords = ["package-manager", "build-system", "vhdl", "verilog", "systemverilog"]
repository = "https://github.com/chaseruskin/orbit"
documentation = "https://chaseruskin.github.io/orbit"
default-run = "orbit"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
cliproc = "2"
colored = "3"
curl = { version = "0.4.49", features = ["static-ssl"] }
flate2 = "1.1.9"
fs_extra = "1.3"
glob = "0.3"
home = "0.5"
ignore = "0.4"
mdbook-driver = { version = "0.5.2", features = ["search"] }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0.108"
spdx = "0.13.3"
tempfile = "3.26"
thiserror = "2.0"
tar = "0.4.45"
toml = "1.0.3"
toml_edit = "0.25.3"
uuid = { version = "1.22", features = ["v4", "fast-rng", "macro-diagnostics"] }
uuid25 = { version = "0.3.5", features = ["uuid"] }
zip = "8.2"
